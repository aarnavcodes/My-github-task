<!DOCTYPE html>
<html>
<head>
    <title>Task 2 - Div Selectors</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>

    <h1>CSS Selectors Demonstration</h1>

    <div>
        <h2>First Div - Element Selector</h2>
        <p>This div uses common CSS properties.</p>
    </div>

    <div class="second">
        <h2>Second Div - Class Selector</h2>
        <p>This div uses a class selector to apply different styles.</p>
    </div>

    <div id="third">
        <h2>Third Div - ID Selector</h2>
        <p>This div uses an ID selector to apply unique styles.</p>
    </div>

</body>
</html>
